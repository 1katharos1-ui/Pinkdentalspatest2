<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pink Whisper</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    font-family:'Plus Jakarta Sans',sans-serif;
}

body{
    min-height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#12040c;
    position:relative;
    transition:1s ease;
}

/* ============================= */
/* Luxury animated ambient */
/* ============================= */

body::before{
    content:"";
    position:fixed;
    inset:-20%;
    z-index:-5;

    background:
    radial-gradient(circle at 20% 20%, rgba(255,110,180,.18), transparent 35%),
    radial-gradient(circle at 80% 30%, rgba(255,255,255,.08), transparent 25%),
    radial-gradient(circle at 50% 80%, rgba(255,20,147,.15), transparent 35%);

    filter:blur(60px);

    animation:ambientMove 18s ease-in-out infinite alternate;
}

@keyframes ambientMove{
    from{
        transform:translate(-2%, -2%) scale(1.05);
    }
    to{
        transform:translate(2%, 2%) scale(1.18);
    }
}

/* ============================= */
/* cinematic grain */
/* ============================= */

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:999;
    pointer-events:none;
    opacity:.04;
    mix-blend-mode:soft-light;
    background-image:url("https://grainy-gradients.vercel.app/noise.svg");
}

/* ============================= */
/* smoke canvas */
/* ============================= */

#threeCanvasContainer{
    position:absolute;
    inset:0;
    z-index:0;
    opacity:1;
    transition:1s ease;
}

.dimmed-smoke{
    filter:brightness(.5);
}

/* ============================= */
/* sparkles */
/* ============================= */

#sparkleCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:2;
    pointer-events:none;
}

/* ============================= */
/* background layer */
/* ============================= */

.bg-slider{
    position:absolute;
    inset:0;
    z-index:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transition:1s ease;
    animation:bgZoom 18s ease-in-out infinite alternate;
}

@keyframes bgZoom{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.08);
    }
}

.bg-blur-effect{
    filter:blur(5px);
    transform:scale(1.03);
}

/* ============================= */
/* overlay */
/* ============================= */

.overlay{
    position:absolute;
    inset:0;
    z-index:1;

    background:
    radial-gradient(circle at center,
    rgba(255,255,255,.03),
    rgba(0,0,0,.28));
}

/* ============================= */
/* container */
/* ============================= */

.quiz-container{
    width:92%;
    max-width:470px;
    position:relative;
    z-index:5;

    animation:breathing 7s ease-in-out infinite;
}

@keyframes breathing{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.01);
    }
}

/* ============================= */
/* glass card */
/* ============================= */

.card-box{
    position:relative;
    overflow:hidden;

    background:rgba(255,255,255,.08);

    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);

    border:1px solid rgba(255,255,255,.15);

    border-radius:32px;

    padding:38px 28px;

    box-shadow:
    0 20px 70px rgba(255,20,147,.15),
    inset 0 1px 1px rgba(255,255,255,.15);

    animation:cardFloat 7s ease-in-out infinite;
}

.card-box::before{
    content:"";
    position:absolute;
    top:-100%;
    left:-40%;
    width:60%;
    height:300%;

    transform:rotate(24deg);

    background:linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,.25),
        transparent
    );

    animation:lightSweep 8s linear infinite;
}

@keyframes lightSweep{
    from{
        left:-50%;
    }
    to{
        left:150%;
    }
}

@keyframes cardFloat{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-5px);
    }
}

/* ============================= */
/* video */
/* ============================= */

.welcome-video{
    width:100%;
    border-radius:22px;
    margin-bottom:32px;

    box-shadow:
    0 15px 50px rgba(255,20,147,.18);

    animation:videoGlow 6s ease-in-out infinite;
}

@keyframes videoGlow{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.015);
    }
}

/* ============================= */
/* title */
/* ============================= */

.main-title{
    font-family:'Playfair Display',serif;
    font-size:2.5rem;
    line-height:1.2;
    text-align:center;
    margin-bottom:20px;

    background:linear-gradient(to bottom,#fff,#ffd4ea);

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.sub-title{
    text-align:center;
    color:#e9dce4;
    line-height:1.7;
    font-size:1rem;
    margin-bottom:35px;
}

/* ============================= */
/* button */
/* ============================= */

.start-btn{
    position:relative;
    overflow:hidden;

    width:100%;
    border:none;
    cursor:pointer;

    padding:17px;

    border-radius:20px;

    background:linear-gradient(
        to left,
        #ff0099,
        #ffb6d8
    );

    color:#fff;

    font-size:1.05rem;
    font-weight:700;

    transition:.35s ease;

    box-shadow:
    0 15px 35px rgba(255,20,147,.25);
}

.start-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:60%;
    height:100%;

    transform:skewX(-20deg);

    background:linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );

    animation:btnShimmer 4s linear infinite;
}

@keyframes btnShimmer{
    to{
        left:180%;
    }
}

.start-btn:hover{
    transform:translateY(-2px) scale(1.02);

    box-shadow:
    0 20px 45px rgba(255,20,147,.35);
}

/* ============================= */
/* question */
/* ============================= */

#question-text{
    color:#fff;
    font-size:1.45rem;
    line-height:1.7;
    margin-bottom:35px;
    text-align:center;

    text-shadow:
    0 2px 10px rgba(0,0,0,.55);
}

.options-list{
    display:flex;
    flex-direction:column;
    gap:15px;
}

/* ============================= */
/* options */
/* ============================= */

.option-btn{
    position:relative;
    overflow:hidden;

    border:none;
    cursor:pointer;

    padding:20px;

    border-radius:22px;

    color:#fff;

    font-size:1rem;
    font-weight:600;

    text-align:right;

    background:rgba(255,20,147,.16);

    border:1px solid rgba(255,255,255,.12);

    backdrop-filter:blur(14px);

    transition:.35s ease;

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,.08),
    0 10px 25px rgba(0,0,0,.12);

    animation:slideIn .5s ease both;
}

.option-btn:nth-child(2){
    animation-delay:.07s;
}

.option-btn:nth-child(3){
    animation-delay:.14s;
}

.option-btn:nth-child(4){
    animation-delay:.21s;
}

.option-btn::before{
    content:"";
    position:absolute;
    inset:0;

    background:
    radial-gradient(circle at top left,
    rgba(255,255,255,.22),
    transparent 60%);

    opacity:0;
    transition:.35s ease;
}

.option-btn:hover::before{
    opacity:1;
}

.option-btn:hover{
    transform:translateY(-3px) scale(1.02);

    background:rgba(255,20,147,.28);

    box-shadow:
    0 15px 35px rgba(255,20,147,.18);
}

@keyframes slideIn{
    from{
        opacity:0;
        transform:translateX(-20px);
    }
    to{
        opacity:1;
        transform:translateX(0);
    }
}

/* ============================= */
/* result */
/* ============================= */

#result-screen{
    text-align:center;
    color:#fff;
}

.result-intro{
    color:#ffb8d7;
    margin-bottom:10px;
    font-weight:700;
    letter-spacing:1px;
}

.result-badge{
    font-size:3.2rem;
    font-weight:900;
    margin-bottom:12px;

    animation:luxuryGlow 3s ease-in-out infinite;
}

@keyframes luxuryGlow{
    0%,100%{
        text-shadow:
        0 0 25px rgba(255,255,255,.12),
        0 0 40px rgba(255,20,147,.22);
    }

    50%{
        text-shadow:
        0 0 35px rgba(255,255,255,.2),
        0 0 70px rgba(255,20,147,.45);
    }
}

.result-score{
    font-size:1.4rem;
    margin-bottom:25px;
}

.result-description{
    line-height:1.8;
    color:#f8e9f1;
    margin-bottom:30px;
}

.result-cta{
    line-height:1.8;
    color:#fff;

    animation:pulse 2.5s infinite;
}

@keyframes pulse{
    0%,100%{
        opacity:1;
    }
    50%{
        opacity:.7;
    }
}

/* ============================= */

.hidden{
    display:none !important;
}

.mode-glow-bg{
    background:
    radial-gradient(circle,#ffb6d5 0%, #ff4da6 100%);
}

.mode-balance-bg{
    background:
    linear-gradient(135deg,#29121d,#ff4da6);
}

.mode-revival-bg{
    background:
    radial-gradient(circle,#18030c,#45152f);
}

@media(max-width:768px){

    .main-title{
        font-size:2rem;
    }

    .result-badge{
        font-size:2.5rem;
    }

    .card-box{
        padding:30px 22px;
    }
}

</style>
</head>

<body>

<div id="threeCanvasContainer"></div>

<div class="bg-slider" id="bg-layer"></div>

<div class="overlay"></div>

<canvas id="sparkleCanvas"></canvas>

<div class="quiz-container" id="quiz-box">

<div id="welcome-screen">

<div class="card-box">

<video class="welcome-video" id="introVideo" playsinline>
<source src="intro.mp4" type="video/mp4">
</video>

<div class="main-title">
Enter the PINK world
</div>

<div class="sub-title">
Not everything needs to be said loud...<br>
Some things are only whispered.
</div>

<button class="start-btn" id="startBtn">
Pink Whisper 🤍
</button>

</div>
</div>

<div id="question-screen" class="hidden">

<div class="card-box">

<h2 id="question-text"></h2>

<div class="options-list" id="options-container"></div>

</div>
</div>

<div id="result-screen" class="hidden">

<div class="card-box">

<div class="result-intro">
YOUR WHISPER RESULT
</div>

<div class="result-badge" id="badge-container"></div>

<div class="result-score" id="score-container"></div>

<div class="result-description" id="description-container"></div>

<div class="result-cta">
Send us your result screenshot<br>
and unlock your Pink Spa experience 💗
</div>

</div>
</div>

</div>

<script>

/* ============================= */
/* smoke */
/* ============================= */

const container = document.getElementById("threeCanvasContainer");

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(
-1,1,1,-1,0,1
);

const renderer = new THREE.WebGLRenderer({
alpha:true,
antialias:true
});

renderer.setSize(window.innerWidth, window.innerHeight);

container.appendChild(renderer.domElement);

const loader = new THREE.TextureLoader();

const smokeTexture = loader.load("1000455138.jpg");

smokeTexture.wrapS = THREE.RepeatWrapping;
smokeTexture.wrapT = THREE.RepeatWrapping;

const material = new THREE.ShaderMaterial({

transparent:true,

uniforms:{
uTime:{value:0},
uTexture:{value:smokeTexture},
uResolution:{
value:new THREE.Vector2(
window.innerWidth,
window.innerHeight
)
}
},

vertexShader:`
varying vec2 vUv;

void main(){
vUv = uv;
gl_Position = vec4(position,1.);
}
`,

fragmentShader:`

uniform sampler2D uTexture;
uniform float uTime;
uniform vec2 uResolution;

varying vec2 vUv;

vec2 distort(vec2 p,float t){

p.x += sin(p.y * 4. + t * .35) * .03;
p.y += cos(p.x * 3. + t * .25) * .03;

return p;
}

void main(){

vec2 st = gl_FragCoord.xy / uResolution.xy;

vec2 uv1 = distort(st, uTime);
vec2 uv2 = distort(st, -uTime * .7 + 3.);

vec4 tex1 = texture2D(uTexture, uv1);
vec4 tex2 = texture2D(uTexture, uv2);

vec4 finalTex = mix(tex1, tex2, .45);

gl_FragColor = vec4(finalTex.rgb, finalTex.a * .95);

}
`
});

const mesh = new THREE.Mesh(
new THREE.PlaneGeometry(2,2),
material
);

scene.add(mesh);

const clock = new THREE.Clock();

function animateSmoke(){

requestAnimationFrame(animateSmoke);

material.uniforms.uTime.value =
clock.getElapsedTime();

renderer.render(scene,camera);
}

animateSmoke();

/* ============================= */
/* sparkles */
/* ============================= */

const sparkleCanvas =
document.getElementById("sparkleCanvas");

const ctx =
sparkleCanvas.getContext("2d");

sparkleCanvas.width = innerWidth;
sparkleCanvas.height = innerHeight;

const sparkles = [];

class Sparkle{

constructor(){

this.x = Math.random() * innerWidth;
this.y = Math.random() * innerHeight;

this.size = Math.random() * 2 + 1;

this.speedY = -.15 - Math.random() * .15;

this.opacity = Math.random() * .7;

this.phase = Math.random() * 100;
}

update(){

this.y += this.speedY;

if(this.y < -20){

this.y = innerHeight + 20;
this.x = Math.random() * innerWidth;
}
}

draw(){

ctx.save();

ctx.translate(this.x,this.y);

const pulse =
this.opacity *
(.4 + Math.sin(Date.now() * .003 + this.phase) * .6);

ctx.fillStyle =
`rgba(255,255,255,${pulse})`;

ctx.shadowBlur = 10;
ctx.shadowColor = "#fff";

ctx.beginPath();

for(let i=0;i<4;i++){

ctx.rotate(Math.PI / 2);

ctx.lineTo(0,this.size * 4);
ctx.lineTo(this.size,0);
}

ctx.fill();

ctx.restore();
}
}

for(let i=0;i<25;i++){

sparkles.push(new Sparkle());
}

function animateSparkles(){

ctx.clearRect(0,0,innerWidth,innerHeight);

sparkles.forEach(s=>{
s.update();
s.draw();
});

requestAnimationFrame(animateSparkles);
}

animateSparkles();

/* ============================= */
/* quiz */
/* ============================= */

const quizData = [

{
question:"كم مرة تشرب قهوة او شاي يوميا؟",
options:["ولا مرة","مرة او مرتان","من ثلاث الى خمس مرات","عايش عليها"],
scores:[100,70,35,0],
image:"bg1.png"
},

{
question:"هل تدخن؟",
options:["لا","احيانا","يوميا","عدة باكيتات باليوم"],
scores:[100,70,35,0],
image:"bg2.png"
},

{
question:"هل تشرب ماء كافي يوميا؟",
options:["نعم","أحياناً","لا"],
scores:[100,50,0],
image:"bg3.png"
},

{
question:"تحس بجفاف بالفم؟",
options:["نادراً","احياناً","دائماً"],
scores:[100,50,0],
image:"bg4.png"
}

];

let current = 0;
let total = 0;

const bgLayer =
document.getElementById("bg-layer");

const questionScreen =
document.getElementById("question-screen");

const welcomeScreen =
document.getElementById("welcome-screen");

const resultScreen =
document.getElementById("result-screen");

const questionText =
document.getElementById("question-text");

const optionsContainer =
document.getElementById("options-container");

const badgeContainer =
document.getElementById("badge-container");

const scoreContainer =
document.getElementById("score-container");

const descriptionContainer =
document.getElementById("description-container");

/* ============================= */

document.getElementById("startBtn")
.addEventListener("click",()=>{

container.classList.add("dimmed-smoke");

document.getElementById("introVideo")
.play();

setTimeout(()=>{

welcomeScreen.classList.add("hidden");

questionScreen.classList.remove("hidden");

loadQuestion();

},2500);
});

/* ============================= */

function loadQuestion(){

const q = quizData[current];

bgLayer.style.opacity = 1;
bgLayer.style.backgroundImage =
`url('${q.image}')`;

questionText.innerText =
q.question;

optionsContainer.innerHTML = "";

q.options.forEach((option,index)=>{

const btn =
document.createElement("button");

btn.className = "option-btn";

btn.innerText = option;

btn.onclick = ()=>selectAnswer(index);

optionsContainer.appendChild(btn);

});
}

/* ============================= */

function selectAnswer(index){

const q = quizData[current];

total += q.scores[index];

bgLayer.classList.add("bg-blur-effect");

setTimeout(()=>{

bgLayer.classList.remove("bg-blur-effect");

current++;

if(current < quizData.length){

loadQuestion();

}else{

showResults();
}

},500);
}

/* ============================= */

function animateScore(target){

let currentScore = 0;

const increment = target / 40;

const interval = setInterval(()=>{

currentScore += increment;

if(currentScore >= target){

currentScore = target;

clearInterval(interval);
}

scoreContainer.innerText =
`${currentScore.toFixed(1)}%`;

},20);
}

/* ============================= */

function showResults(){

questionScreen.classList.add("hidden");

resultScreen.classList.remove("hidden");

let finalScore =
(total / quizData.length).toFixed(1);

let word = "";
let desc = "";

if(finalScore >= 90){

document.body.classList.add("mode-glow-bg");

word = "Pink Glow";

desc =
"Freshness, confidence, and care are clearly part of your whisper energy.";

confetti({
particleCount:120,
spread:90
});

}else if(finalScore >= 70){

document.body.classList.add("mode-balance-bg");

word = "Pink Balance";

desc =
"Small daily habits may be affecting your freshness more than you notice.";

}else{

document.body.classList.add("mode-revival-bg");

word = "Pink Revival";

desc =
"Your whisper is ready for a fresh beginning.";

}

badgeContainer.innerText = word;

descriptionContainer.innerText = desc;

animateScore(Number(finalScore));
}

/* ============================= */

window.addEventListener("resize",()=>{

renderer.setSize(
window.innerWidth,
window.innerHeight
);

material.uniforms.uResolution.value.set(
window.innerWidth,
window.innerHeight
);

sparkleCanvas.width = innerWidth;
sparkleCanvas.height = innerHeight;

});

</script>

</body>
</html>
