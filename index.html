<!-- LUXURY SOFT VISUAL UPGRADE -->
<!-- ========================= -->

<style>

/* ===== Luxury animated background ===== */

body::before{
    content:"";
    position:fixed;
    inset:-20%;
    z-index:-2;
    background:
    radial-gradient(circle at 20% 20%, rgba(255,120,200,.22), transparent 35%),
    radial-gradient(circle at 80% 30%, rgba(255,255,255,.08), transparent 25%),
    radial-gradient(circle at 50% 80%, rgba(255,70,180,.15), transparent 35%);
    animation: ambientMove 18s ease-in-out infinite alternate;
    filter: blur(40px);
    transform: scale(1.1);
}

@keyframes ambientMove{
    0%{
        transform:translate3d(-2%, -1%, 0) scale(1.1);
    }
    100%{
        transform:translate3d(2%, 2%, 0) scale(1.18);
    }
}

/* ===== cinematic grain overlay ===== */

body::after{
    content:"";
    position:fixed;
    inset:0;
    z-index:999;
    pointer-events:none;
    opacity:.045;
    mix-blend-mode:soft-light;
    background-image:url("https://grainy-gradients.vercel.app/noise.svg");
}

/* ===== glass luxury card ===== */

.card-box{
    background:rgba(255,255,255,.08) !important;
    backdrop-filter: blur(22px) saturate(160%);
    -webkit-backdrop-filter: blur(22px) saturate(160%);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:
    0 20px 70px rgba(255,20,147,.18),
    inset 0 1px 1px rgba(255,255,255,.25);
    
    animation: cardFloat 7s ease-in-out infinite;
    overflow:hidden;
    position:relative;
}

/* ===== moving light sweep ===== */

.card-box::before{
    content:"";
    position:absolute;
    top:-120%;
    left:-40%;
    width:60%;
    height:300%;
    transform:rotate(24deg);
    background:linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,.08),
        rgba(255,255,255,.35),
        rgba(255,255,255,.08),
        transparent
    );
    animation: lightSweep 7s linear infinite;
}

@keyframes lightSweep{
    0%{
        left:-60%;
    }
    100%{
        left:140%;
    }
}

@keyframes cardFloat{
    0%,100%{
        transform:translateY(0px);
    }
    50%{
        transform:translateY(-6px);
    }
}

/* ===== luxury breathing ===== */

.quiz-container{
    animation: breathing 7s ease-in-out infinite;
}

@keyframes breathing{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.012);
    }
}

/* ===== enhanced video ===== */

.welcome-video{
    box-shadow:
    0 20px 60px rgba(255,20,147,.18),
    0 0 80px rgba(255,255,255,.08) !important;

    animation: videoGlow 6s ease-in-out infinite;
}

@keyframes videoGlow{
    0%,100%{
        transform:scale(1);
        filter:brightness(1);
    }
    50%{
        transform:scale(1.01);
        filter:brightness(1.06);
    }
}

/* ===== luxury title ===== */

.main-title{
    background:linear-gradient(
        to bottom,
        #ffffff,
        #ffd6eb
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;

    text-shadow:
    0 0 25px rgba(255,255,255,.15);
}

/* ===== shimmer button ===== */

.start-btn{
    position:relative;
    overflow:hidden;
}

.start-btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:60%;
    height:100%;
    transform:skewX(-20deg);

    background:linear-gradient(
        to right,
        transparent,
        rgba(255,255,255,.45),
        transparent
    );

    animation: btnShimmer 4s linear infinite;
}

@keyframes btnShimmer{
    100%{
        left:160%;
    }
}

/* ===== enhanced options ===== */

.option-btn{
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);

    box-shadow:
    inset 0 1px 1px rgba(255,255,255,.15),
    0 8px 20px rgba(0,0,0,.12);

    transition:
    transform .35s ease,
    background .35s ease,
    box-shadow .35s ease,
    border-color .35s ease;
}

.option-btn::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:inherit;
    opacity:0;
    background:
    radial-gradient(circle at top left,
    rgba(255,255,255,.25),
    transparent 60%);
    transition:opacity .35s ease;
}

.option-btn:hover::before{
    opacity:1;
}

.option-btn:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:
    0 15px 35px rgba(255,20,147,.2),
    inset 0 1px 1px rgba(255,255,255,.15);
}

/* ===== smooth cinematic blur ===== */

.bg-slider{
    animation: bgZoom 18s ease-in-out infinite alternate;
}

@keyframes bgZoom{
    0%{
        transform:scale(1);
    }
    100%{
        transform:scale(1.08);
    }
}

/* ===== floating aura ===== */

.overlay{
    background:
    radial-gradient(circle at center,
    rgba(255,255,255,.02),
    rgba(0,0,0,.18)) !important;
}

/* ===== result luxury glow ===== */

.result-badge{
    position:relative;
    animation:
    badgeBounce .7s cubic-bezier(.34,1.56,.64,1) .15s both,
    luxuryGlow 3.5s ease-in-out infinite;
}

@keyframes luxuryGlow{
    0%,100%{
        text-shadow:
        0 0 20px rgba(255,255,255,.12),
        0 0 40px rgba(255,105,180,.22);
    }
    50%{
        text-shadow:
        0 0 30px rgba(255,255,255,.25),
        0 0 70px rgba(255,105,180,.4);
    }
}

/* ===== floating sparkles ===== */

#sparkleCanvas{
    filter: blur(.2px);
}

/* ===== result card animation ===== */

#result-screen{
    animation:
    fadeInResult .8s cubic-bezier(.215,.610,.355,1) forwards,
    resultFloat 5s ease-in-out infinite;
}

@keyframes resultFloat{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-4px);
    }
}

/* ===== soft glow on hover ===== */

.start-btn:hover{
    box-shadow:
    0 15px 40px rgba(255,0,204,.35),
    0 0 50px rgba(255,255,255,.12);
}

/* ===== elegant scrollbar ===== */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.18);
    border-radius:20px;
}

/* ===== cinematic fade ===== */

.hidden{
    animation:fadeOut .4s ease;
}

@keyframes fadeOut{
    from{
        opacity:1;
    }
    to{
        opacity:0;
    }
}

/* ===== responsive polish ===== */

@media(max-width:768px){

    .card-box{
        padding:32px 22px;
        border-radius:28px;
    }

    .main-title{
        font-size:2rem;
    }

    .result-badge{
        font-size:2.7rem;
    }

    .option-btn{
        font-size:1rem;
        padding:18px 20px;
    }
}

</style>

<script>

/* ===== luxury mouse aura ===== */

const aura = document.createElement("div");

aura.style.position = "fixed";
aura.style.width = "320px";
aura.style.height = "320px";
aura.style.borderRadius = "50%";
aura.style.pointerEvents = "none";
aura.style.zIndex = "0";
aura.style.background = `
radial-gradient(circle,
rgba(255,120,200,.16),
transparent 70%)
`;

aura.style.filter = "blur(30px)";
aura.style.transition = "transform .12s linear";

document.body.appendChild(aura);

document.addEventListener("mousemove", (e)=>{

    aura.style.transform = `
    translate(
        ${e.clientX - 160}px,
        ${e.clientY - 160}px
    )
    `;
});

/* ===== score smooth counter ===== */

function animateScore(target){

    let current = 0;

    const increment = target / 45;

    const interval = setInterval(()=>{

        current += increment;

        if(current >= target){
            current = target;
            clearInterval(interval);
        }

        scoreContainer.innerText =
        `${current.toFixed(1)}%`;

    },20);
}

/* ===== overwrite original result ===== */

const originalShowResults = showResults;

showResults = function(){

    originalShowResults();

    const finalValue =
    parseFloat(scoreContainer.innerText);

    scoreContainer.innerText = "0%";

    setTimeout(()=>{
        animateScore(finalValue);
    },350);

    document.body.animate([
        {
            filter:"brightness(1)"
        },
        {
            filter:"brightness(1.08)"
        },
        {
            filter:"brightness(1)"
        }
    ],{
        duration:2200,
        easing:"ease"
    });
};

</script>
